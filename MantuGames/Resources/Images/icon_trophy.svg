<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- glow -->
  <circle cx="50" cy="44" r="34" fill="#FFF176" opacity="0.5"/>
  <!-- trophy cup body -->
  <path d="M30,16 L70,16 L66,50 Q64,62 50,65 Q36,62 34,50 Z" fill="#FFD700"/>
  <!-- inner shading -->
  <path d="M36,20 L64,20 L61,48 Q59,58 50,61 Q41,58 39,48 Z" fill="#FFE566"/>
  <!-- handles -->
  <path d="M30,20 Q16,20 16,34 Q16,44 30,46" stroke="#FFA000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M70,20 Q84,20 84,34 Q84,44 70,46" stroke="#FFA000" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- stem -->
  <rect x="44" y="65" width="12" height="12" rx="3" fill="#FFA000"/>
  <!-- base -->
  <rect x="34" y="77" width="32" height="8" rx="5" fill="#FFA000"/>
  <!-- eyes -->
  <ellipse cx="43" cy="38" rx="3.5" ry="4.5" fill="#3D2B1F"/>
  <ellipse cx="57" cy="38" rx="3.5" ry="4.5" fill="#3D2B1F"/>
  <circle cx="45" cy="36" r="1.4" fill="white"/>
  <circle cx="59" cy="36" r="1.4" fill="white"/>
  <!-- smile -->
  <path d="M40,48 Q50,57 60,48" stroke="#3D2B1F" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="36" cy="46" rx="4.5" ry="3" fill="#FF8A80" opacity="0.55"/>
  <ellipse cx="64" cy="46" rx="4.5" ry="3" fill="#FF8A80" opacity="0.55"/>
  <!-- crown sparkles -->
  <text x="22" y="18" font-size="12" fill="#FFC107">✦</text>
  <text x="70" y="14" font-size="10" fill="#FFC107">✦</text>
  <text x="46" y="10" font-size="9" fill="#FFD740">★</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- clock body shadow -->
  <circle cx="50" cy="52" r="38" fill="#B71C1C" opacity="0.25"/>
  <!-- clock body -->
  <circle cx="50" cy="50" r="38" fill="#EF5350"/>
  <!-- clock face -->
  <circle cx="50" cy="50" r="30" fill="#FFCDD2"/>
  <!-- highlight -->
  <!-- hour ticks -->
  <line x1="50" y1="22" x2="50" y2="28" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="72" x2="50" y2="78" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="28" y2="50" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="78" y2="50" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <!-- hands -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="66" y2="54" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3.5" fill="#B71C1C"/>
  <!-- sad eyes -->
  <ellipse cx="41" cy="58" rx="3.5" ry="4" fill="#3D2B1F"/>
  <ellipse cx="59" cy="58" rx="3.5" ry="4" fill="#3D2B1F"/>
  <circle cx="43" cy="56" r="1.3" fill="white"/>
  <circle cx="61" cy="56" r="1.3" fill="white"/>
  <!-- sad mouth -->
  <path d="M38,70 Q50,64 62,70" stroke="#3D2B1F" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- crown on top -->
  <rect x="38" y="8" width="24" height="6" rx="2" fill="#FFA000"/>
  <polygon points="38,14 42,4 50,10 58,4 62,14" fill="#FFC107"/>
</svg>

# Mantu Games — ProGuard / R8 keep rules (Release builds)
# These libraries use reflection / native entry points that R8 must not strip.

# Google Mobile Ads (AdMob)
-keep class com.google.android.gms.ads.** { *; }
-keep class com.google.android.gms.ads.internal.** { *; }
-dontwarn com.google.android.gms.ads.**

# Plugin.MauiMTAdmob
-keep class Plugin.MauiMTAdmob.** { *; }
-dontwarn Plugin.MauiMTAdmob.**

# Plugin.InAppBilling (Google Play Billing)
-keep class Plugin.InAppBilling.** { *; }
-keep class com.android.vending.billing.** { *; }
-dontwarn Plugin.InAppBilling.**

# Plugin.Maui.Audio
-keep class Plugin.Maui.Audio.** { *; }
-dontwarn Plugin.Maui.Audio.**

# .NET MAUI bindings entry points
-keep class com.microsoft.maui.** { *; }
-keep class crc64** { *; }